name: Healthcare Clinical Intelligence CI

on:
  push:
    paths:
      - "projects/healthcare/healthcare_clinical_intelligence/**"
      - ".github/workflows/healthcare-clinical-intelligence-ci.yml"
  pull_request:
    paths:
      - "projects/healthcare/healthcare_clinical_intelligence/**"
      - ".github/workflows/healthcare-clinical-intelligence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthcare-clinical-intelligence-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/healthcare/healthcare_clinical_intelligence

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/healthcare/healthcare_clinical_intelligence/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[postgres,test,ml,dev]'
      - run: make lint
      - run: make format-check
      - run: make typecheck
      - run: make coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: healthcare-clinical-intelligence-coverage
          path: projects/healthcare/healthcare_clinical_intelligence/coverage.xml

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthcare_clinical_intelligence
          POSTGRES_USER: healthcare_app
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare_app -d healthcare_clinical_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/healthcare/healthcare_clinical_intelligence/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[postgres,test,ml]'
      - run: python scripts/run_postgres_smoke.py --dsn "$HCI_TEST_DSN"
        env:
          HCI_TEST_DSN: postgresql://healthcare_app:change-me@localhost:5432/healthcare_clinical_intelligence
