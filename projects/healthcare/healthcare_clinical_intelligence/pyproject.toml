[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-clinical-intelligence"
version = "0.2.0"
description = "Synthetic FHIR clinical data platform and analytics portfolio project"
requires-python = ">=3.11"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10", "pytest-cov>=7,<8"]
ml = ["scikit-learn>=1.5,<2"]
dev = ["mypy>=2.3,<2.4", "pre-commit>=4,<5", "ruff>=0.16,<0.17"]

[project.scripts]
hci = "healthcare_clinical_intelligence.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["healthcare_clinical_intelligence"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
