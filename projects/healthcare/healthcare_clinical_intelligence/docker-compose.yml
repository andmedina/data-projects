services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_clinical_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-healthcare_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    profiles: ["fhir-api"]
    ports:
      - "8080:8080"

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["orchestration"]
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      HCI_DATABASE_DSN: postgresql://healthcare_app:change-me@postgres:5432/healthcare_clinical_intelligence
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
